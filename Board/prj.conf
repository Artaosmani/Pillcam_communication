# USB device stack "next" with one CDC-ACM UART on the high-speed controller (J3)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_LOG=y
# logs go to the UART console on the DK's debugger port, never to the CDC-ACM data port

#axon
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=120000
# logs go to the UART console on the DK's debugger port, never to the CDC-ACM data


# the CDC-ACM class logs every FIFO call / packet at INF; keep only warnings
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
# CPU busy share during the frame receive (rx_busy_pct in the reply)
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y

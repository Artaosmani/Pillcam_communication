# USB device stack "next" with one CDC-ACM UART on the high-speed controller (J3)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SAMPLE_USBD_PRODUCT="nRF54LM20 polyp classifier"

# Axon NPU (Edge AI add-on). Interlayer buffer >= the value the Axon compiler reports for the model.
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=65536

CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_LOG=y
# logs go to the UART console on the DK's debugger port, never to the CDC-ACM data port

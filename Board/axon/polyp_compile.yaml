# Axon NPU TFLite compiler input (Edge AI add-on). Run from the add-on's tools/axon/compiler directory:
#   python scripts/axons_ml_nn_compiler_executor.py <path>/Board/axon/polyp_compile.yaml
# Paths are relative to where you run it, or absolute. See the add-on docs for every key.

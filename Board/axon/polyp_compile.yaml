TFLITE_MODEL: <path>/Anomally_detection/runs/classifier_96/model_int8.tflite
# Optional, to get the compiler's accuracy / quantisation-loss report and test vectors:
# FLOAT_MODEL: ...
# TEST_DATA: ...
# TEST_LABELS: ...
# HEADER_FILE_TEST_VECTOR_CNT: 0
